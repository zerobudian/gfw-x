name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build web UI
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: go build -o gfwx ./cmd/gfwx

      - name: Validate config & rules
        run: |
          ./gfwx validate --config configs/config.yaml --rules configs/rules/developer.txt

      - name: Smoke test (bench)
        run: ./gfwx bench --flows 5000 --workers 2

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build web UI
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Build all platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          for t in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $t; os=$1; arch=$2
            out=dist/gfwx-${os}-${arch}
            [ "$os" = "windows" ] && out=${out}.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X gfw-x/internal/version.Version=${VERSION}" \
              -o ${out} ./cmd/gfwx
            tar -czf ${out}.tar.gz ${out}
          done

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true