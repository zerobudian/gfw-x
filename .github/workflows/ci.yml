name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build binary
        run: go build -trimpath -o gfwx ./cmd/gfwx

  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      # The committed embedded bundle must match the source so a fresh clone
      # compiles out-of-the-box. Fail if a rebuild changes internal/api/dist.
      - name: Check embedded bundle is in sync
        run: |
          if ! git diff --exit-code --quiet -- internal/api/dist; then
            echo "internal/api/dist is stale; run 'make web' and commit the result" >&2
            git status --porcelain internal/api/dist
            exit 1
          fi